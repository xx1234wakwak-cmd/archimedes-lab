<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archimedes Lab</title>
<style>
body{font-family:sans-serif;text-align:center;background:#f5f7fa;margin:0;padding:15px}
.panel{background:white;max-width:900px;margin:10px auto;padding:12px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
canvas{background:white;border:1px solid #ccc;max-width:100%}
button{font-size:18px;margin:5px;padding:6px 14px}
button.is-active{background:#2f6fbd;color:white;border-color:#245892}
#outerButtons{display:none}
#mission{background:#fff8d6;font-size:24px;align-self:stretch}
#mission h2{font-size:38px;margin:0}
.mission-one{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.mission-check{width:22px;height:22px;margin:0;accent-color:#18a84a;opacity:1;pointer-events:none}
.mission-answer{width:90px;font:inherit;text-align:center;padding:3px 6px;box-sizing:border-box}
.mission-n{white-space:nowrap}
.discovery-badge{display:none;align-items:center;padding:4px 10px;border-radius:999px;background:#18a84a;color:white;font-size:.82em;font-weight:700;line-height:1.2;white-space:nowrap;box-shadow:0 2px 5px rgba(24,168,74,.28);transform-origin:center}
.discovery-badge.is-visible{display:inline-flex}
.discovery-badge.is-animating{animation:discovery-pop 420ms ease-out}
@keyframes discovery-pop{0%{transform:scale(.72);opacity:0}55%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.discovery-badge.is-animating{animation:none}}
.main-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:stretch;gap:16px;width:100%;max-width:1200px;margin:10px auto}
.main-layout>.panel{width:auto;max-width:none;margin:0;box-sizing:border-box}
.graph-panel{display:flex;align-items:flex-start;justify-content:center}
.graph-panel canvas{display:block;width:100%;max-width:700px;height:auto;cursor:grab;touch-action:none}
.graph-panel canvas.is-dragging{cursor:grabbing}
.control-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px}
.n-control,.rotation-control{display:flex;align-items:center;justify-content:center;gap:8px}
#nLabel{display:inline-block;min-width:54px;font-size:20px;font-weight:700}
.rotation-control label{font-size:18px;white-space:nowrap}
#rotSlider{width:min(360px,42vw)}
/* 横幅は十分あるが高さが低いPC・Chromebook向け */
@media (min-width:901px) and (max-height:900px){
  body{padding:6px}
  h1{font-size:clamp(22px,3.2vh,30px);margin:4px 0}
  .main-layout{gap:10px;margin:5px auto}
  .panel{margin:5px auto;padding:7px}
  #mission{font-size:clamp(16px,2.35vh,21px)}
  #mission h2{font-size:clamp(24px,3.8vh,32px)}
  .graph-panel canvas{
    width:auto;
    height:clamp(360px,calc(100svh - 205px),560px);
    max-width:100%;
  }
  button{font-size:15px;margin:2px;padding:5px 10px}
  .control-row{gap:8px}
  #nLabel{font-size:18px}
  .rotation-control label{font-size:16px}
}
/* 特に高さが低い横長端末向け */
@media (min-width:901px) and (max-height:680px){
  body{padding:3px}
  h1{font-size:21px;margin:1px 0}
  .main-layout{gap:6px;margin:3px auto}
  .panel{margin:3px auto;padding:5px}
  #mission{font-size:15px}
  #mission h2{font-size:21px}
  .graph-panel canvas{
    height:clamp(320px,calc(100svh - 170px),455px);
  }
  button{min-height:30px;font-size:14px;margin:1px;padding:3px 8px}
  .control-row{gap:5px}
}
@media (max-width:900px){.main-layout{display:block;max-width:900px;margin:0 auto}.main-layout>.panel{width:auto;max-width:900px;margin:10px auto}#mission{min-height:0}.graph-panel{display:block;text-align:center}.graph-panel canvas{width:auto;max-width:100%;height:auto;margin:0 auto}}
@media (max-width:600px){body{padding:8px}h1{font-size:28px;margin:12px 0}.panel,.main-layout>.panel{margin:8px auto;padding:8px}button{min-height:44px;margin:4px;padding:8px 12px;font-size:16px}#mission{font-size:18px}#mission h2{font-size:27px}.control-row{gap:6px}.n-control,.rotation-control{width:100%}.rotation-control label{font-size:16px}#rotSlider{width:min(300px,72vw)!important;min-height:32px;vertical-align:middle}canvas,.graph-panel canvas{width:100%;height:auto}}
</style>
</head>
<body>
<h1>Archimedes Lab</h1>
<div class="main-layout">
  <div class="panel" id="mission"></div>
  <div class="panel graph-panel"><canvas id="cv" width="700" height="700"></canvas></div>
</div>
<div class="panel">
  <button id="innerModeButton" type="button" onclick="setMode('inner')">内接</button>
  <button id="outerModeButton" type="button" onclick="setMode('outer')" style="display:none">外接</button>
  <button id="trianglesButton" type="button" onclick="toggleTriangles()">三角形を見る</button>
  <button id="centerAngleButton" type="button" onclick="toggleCenterAngle()">中心角を見る</button>
  <div id="outerButtons">
    <button id="hButton" type="button" onclick="toggleH()">Hを見る</button>
    <button id="tanButton" type="button" onclick="toggleTan()">AHの長さは？</button>
  </div>
</div>
<div class="panel control-row">
  <div class="n-control" aria-label="正多角形の辺の数">
    <button type="button" onclick="changeN(-1)" aria-label="辺の数を1減らす">－</button>
    <span id="nLabel"></span>
    <button type="button" onclick="changeN(1)" aria-label="辺の数を1増やす">＋</button>
  </div>
  <div class="rotation-control">
    <label for="rotSlider">回転</label>
    <input type="range" id="rotSlider" min="-180" max="180" value="0" aria-label="多角形の回転角度">
  </div>
</div>
<script>
let mode="inner",n=3,showTriangles=false,showCenterAngle=false,showH=false,showTan=false;
let lastPolygonPoints=[];
let isDraggingPolygon=false;
let dragPointerId=null;
let dragStartAngle=0;
let dragStartSliderValue=0;
const missionAnswers={inner:"",outer:""};
const missionChecks={step2:false,step3:false,step4:false};
let outerUnlocked=false;
const canvas=document.getElementById("cv"),ctx=canvas.getContext("2d"),slider=document.getElementById("rotSlider");
slider.addEventListener("input",draw);

function getCanvasPoint(event){
  const rect=canvas.getBoundingClientRect();
  return {
    x:(event.clientX-rect.left)*canvas.width/rect.width,
    y:(event.clientY-rect.top)*canvas.height/rect.height
  };
}
function pointToSegmentDistance(px,py,ax,ay,bx,by){
  const abx=bx-ax,aby=by-ay;
  const lengthSquared=abx*abx+aby*aby;
  if(lengthSquared===0)return Math.hypot(px-ax,py-ay);
  const t=Math.max(0,Math.min(1,((px-ax)*abx+(py-ay)*aby)/lengthSquared));
  return Math.hypot(px-(ax+t*abx),py-(ay+t*aby));
}
function isNearPolygon(point){
  if(lastPolygonPoints.length<3)return false;
  const hitWidth=32;
  for(let i=0;i<lastPolygonPoints.length;i++){
    const a=lastPolygonPoints[i];
    const b=lastPolygonPoints[(i+1)%lastPolygonPoints.length];
    if(pointToSegmentDistance(point.x,point.y,a.x,a.y,b.x,b.y)<=hitWidth)return true;
  }
  return false;
}
function normalizeSliderAngle(degrees){
  let value=((degrees+180)%360+360)%360-180;
  if(value===-180&&degrees>0)value=180;
  return value;
}
canvas.addEventListener("pointerdown",event=>{
  const point=getCanvasPoint(event);
  if(!isNearPolygon(point))return;
  isDraggingPolygon=true;
  dragPointerId=event.pointerId;
  dragStartAngle=Math.atan2(point.y-350,point.x-350);
  dragStartSliderValue=Number(slider.value);
  canvas.classList.add("is-dragging");
  canvas.setPointerCapture(event.pointerId);
  event.preventDefault();
});
canvas.addEventListener("pointermove",event=>{
  if(!isDraggingPolygon||event.pointerId!==dragPointerId)return;
  const point=getCanvasPoint(event);
  const currentAngle=Math.atan2(point.y-350,point.x-350);
  const delta=Math.atan2(
    Math.sin(currentAngle-dragStartAngle),
    Math.cos(currentAngle-dragStartAngle)
  );
  slider.value=normalizeSliderAngle(dragStartSliderValue+delta*180/Math.PI);
  draw();
  event.preventDefault();
});
function finishPolygonDrag(event){
  if(!isDraggingPolygon||event.pointerId!==dragPointerId)return;
  isDraggingPolygon=false;
  dragPointerId=null;
  canvas.classList.remove("is-dragging");
  if(canvas.hasPointerCapture(event.pointerId))canvas.releasePointerCapture(event.pointerId);
}
canvas.addEventListener("pointerup",finishPolygonDrag);
canvas.addEventListener("pointercancel",finishPolygonDrag);

function setMode(nextMode){
  if(nextMode==="outer"&&!outerUnlocked)return;
  if(mode==="outer"&&nextMode!=="outer"){showH=false;showTan=false}
  mode=nextMode;draw();renderMission();
}
function changeN(amount){n=Math.max(3,Math.min(30,n+amount));draw();renderMission()}
function toggleTriangles(){showTriangles=!showTriangles;draw()}
function toggleCenterAngle(){showCenterAngle=!showCenterAngle;draw()}
function toggleH(){showH=!showH;if(!showH)showTan=false;draw()}
function toggleTan(){showTan=!showTan;draw()}

function updateControls(){
  const inner=document.getElementById("innerModeButton"),outer=document.getElementById("outerModeButton"),tri=document.getElementById("trianglesButton"),ang=document.getElementById("centerAngleButton"),outerButtons=document.getElementById("outerButtons"),h=document.getElementById("hButton"),tan=document.getElementById("tanButton");
  outer.style.display=outerUnlocked?"inline-block":"none";
  inner.classList.toggle("is-active",mode==="inner");outer.classList.toggle("is-active",mode==="outer");
  inner.setAttribute("aria-pressed",String(mode==="inner"));outer.setAttribute("aria-pressed",String(mode==="outer"));
  tri.classList.toggle("is-active",showTriangles);tri.textContent=showTriangles?"三角形を隠す":"三角形を見る";tri.setAttribute("aria-pressed",String(showTriangles));
  ang.classList.toggle("is-active",showCenterAngle);ang.textContent=showCenterAngle?"中心角を隠す":"中心角を見る";ang.setAttribute("aria-pressed",String(showCenterAngle));
  outerButtons.style.display=mode==="outer"?"block":"none";
  h.classList.toggle("is-active",showH);h.textContent=showH?"Hを隠す":"Hを見る";h.setAttribute("aria-pressed",String(showH));
  tan.style.display=showH?"inline-block":"none";tan.classList.toggle("is-active",showTan);tan.textContent=showTan?"AHの長さを隠す":"AHの長さは？";tan.setAttribute("aria-pressed",String(showTan));
}
function isMissionAnswerCorrect(targetMode,value){if(value==="")return false;const v=Number(value),threshold=targetMode==="inner"?8:10;return Number.isInteger(v)&&v>=3&&v>=threshold}
function sanitizeMissionAnswer(input){const digits=input.value.replace(/[^0-9]/g,"");if(input.value!==digits)input.value=digits;updateMissionAnswer(digits)}
function animateDiscoveryBadge(badge){badge.classList.remove("is-animating");void badge.offsetWidth;badge.classList.add("is-animating")}
function updateMissionAnswer(value){
  missionAnswers.inner=value;
  const correct=isMissionAnswerCorrect("inner",value),check=document.getElementById("mission1Check"),badge=document.getElementById("discoveryBadge");
  if(check)check.checked=correct;
  if(badge){badge.classList.toggle("is-visible",correct);if(correct)animateDiscoveryBadge(badge);else badge.classList.remove("is-animating")}
  updateOuterUnlock();
}
function updateOuterUnlock(){
  outerUnlocked=isMissionAnswerCorrect("inner",missionAnswers.inner)&&missionChecks.step2&&missionChecks.step3&&missionChecks.step4;
  const outer=document.getElementById("outerModeButton"),msg=document.getElementById("unlockMessage");
  if(outer)outer.style.display=outerUnlocked?"inline-block":"none";
  if(msg)msg.innerHTML=outerUnlocked?'<br><div style="color:#18a84a;font-weight:bold;font-size:28px">🎉 MAIN MISSION CLEAR!<br>⭐ BONUS CHALLENGE 解放！</div>':"";
}
function renderMission(){
  const box=document.getElementById("mission");
  if(mode==="outer"){
    box.innerHTML=`<h2>⭐ BONUS CHALLENGE（外接）</h2>① π ＜ 3.25 を満たす n を探せ<br><br>② 赤い辺の長さを求めよう<br><br>③ 正${n}角形の周の長さを求めよう<br><br>④ π の上限を不等式で表そう`;
    return;
  }
  const correct=isMissionAnswerCorrect("inner",missionAnswers.inner);
  box.innerHTML=`<h2>🎯 MAIN MISSION（内接）</h2>
  <div class="mission-one"><input id="mission1Check" class="mission-check" type="checkbox" ${correct?"checked":""} disabled><span>① 3.05＜π を満たす n を探せ</span><label class="mission-n">n＝<input id="mission1Input" class="mission-answer" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="ミッション1のnの値" oninput="sanitizeMissionAnswer(this)"></label><span id="discoveryBadge" class="discovery-badge ${correct?"is-visible":""}" aria-live="polite">✓ 発見！</span></div><br>
  <label><input type="checkbox" id="step2Check">② 赤い辺の長さを求めた</label><br><br>
  <label><input type="checkbox" id="step3Check">③ 正${n}角形の周の長さを求めた</label><br><br>
  <label><input type="checkbox" id="step4Check">④ πの下限を不等式で表した</label><div id="unlockMessage"></div>`;
  document.getElementById("mission1Input").value=missionAnswers.inner;
  ["step2","step3","step4"].forEach((key,index)=>{const el=document.getElementById(`step${index+2}Check`);el.checked=missionChecks[key];el.onchange=()=>{missionChecks[key]=el.checked;updateOuterUnlock()}});
  updateOuterUnlock();
}
function draw(){
  updateControls();document.getElementById("nLabel").textContent=`n=${n}`;ctx.clearRect(0,0,700,700);
  const cx=350,cy=350,baseR=230,maxOuterVertexR=300;
  const R=mode==="outer"?Math.min(baseR,maxOuterVertexR*Math.cos(Math.PI/n)):baseR;
  ctx.strokeStyle="#ddd";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(700,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,700);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.strokeStyle="black";ctx.lineWidth=2;ctx.stroke();
  const redIndex=Math.floor(n/2)-1,nextIndex=(redIndex+1)%n,edgeMidAngle=(redIndex+.5)*(2*Math.PI/n),baseRot=Math.PI/2-edgeMidAngle,userRot=Number(slider.value)*Math.PI/180,rot=baseRot+userRot;
  let finalRot=rot;const drawR=mode==="inner"?R:R/Math.cos(Math.PI/n),pts=[];
  /* 吸着処理は元の値をそのまま維持 */
  if(mode==="inner"){
    const bAngle=rot+2*Math.PI*nextIndex/n,bx=Math.cos(bAngle),by=Math.sin(bAngle);
    if(Math.abs(bx-1)<.10&&Math.abs(by)<.10)finalRot=-2*Math.PI*nextIndex/n;
    const midAngle=rot+(redIndex+.5)*2*Math.PI/n,mxUnit=Math.cos(midAngle),myUnit=Math.sin(midAngle);
    if(mxUnit>.6&&Math.abs(myUnit)<.08)finalRot=-(redIndex+.5)*2*Math.PI/n;
  }
  if(mode==="outer"){
    const midAngle=rot+(redIndex+.5)*2*Math.PI/n,mxUnit=Math.cos(midAngle),myUnit=Math.sin(midAngle);
    if(Math.abs(mxUnit-1)<.10&&Math.abs(myUnit)<.10)finalRot=-(redIndex+.5)*2*Math.PI/n;
  }
  for(let i=0;i<n;i++){const t=finalRot+2*Math.PI*i/n;pts.push({x:cx+drawR*Math.cos(t),y:cy+drawR*Math.sin(t)})}
  lastPolygonPoints=pts.map(point=>({x:point.x,y:point.y}));
  if(showTriangles){ctx.strokeStyle="#888";ctx.lineWidth=1;for(const p of pts){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.stroke()}ctx.beginPath();ctx.arc(cx,cy,4,0,2*Math.PI);ctx.fillStyle="black";ctx.fill();ctx.font="20px sans-serif";ctx.fillText("O",cx+10,cy-10)}
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<n;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.strokeStyle=mode==="inner"?"blue":"purple";ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="black";ctx.font="18px sans-serif";ctx.fillText("1",cx+R+15,cy+20);ctx.fillText("-1",cx-R-35,cy+20);ctx.fillText("1",cx-25,cy-R-10);ctx.fillText("-1",cx-30,cy+R+25);
  ctx.beginPath();ctx.moveTo(pts[redIndex].x,pts[redIndex].y);ctx.lineTo(pts[nextIndex].x,pts[nextIndex].y);ctx.lineWidth=6;ctx.strokeStyle="red";ctx.stroke();
  const mx=(pts[redIndex].x+pts[nextIndex].x)/2,my=(pts[redIndex].y+pts[nextIndex].y)/2;
  if(mode==="outer"&&showH){ctx.fillStyle="green";ctx.beginPath();ctx.arc(mx,my,6,0,2*Math.PI);ctx.fill();ctx.font="22px sans-serif";ctx.fillText("H",mx+10,my)}
  if(mode==="outer"&&showTan){const tx=(pts[redIndex].x+mx)/2,ty=(pts[redIndex].y+my)/2;ctx.fillStyle="green";ctx.font="24px sans-serif";ctx.fillText("tanθ",tx,ty)}
  ctx.beginPath();ctx.arc(mx,my,5,0,2*Math.PI);ctx.fillStyle="red";ctx.fill();
  if(showCenterAngle){
    ctx.strokeStyle="orange";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(pts[redIndex].x,pts[redIndex].y);ctx.lineTo(pts[nextIndex].x,pts[nextIndex].y);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,35,Math.atan2(pts[redIndex].y-cy,pts[redIndex].x-cx),Math.atan2(pts[nextIndex].y-cy,pts[nextIndex].x-cx));ctx.strokeStyle="orange";ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle="black";ctx.font="22px sans-serif";ctx.fillText("O",cx+10,cy-10);ctx.fillText("A",pts[redIndex].x+10,pts[redIndex].y);ctx.fillText("B",pts[nextIndex].x+10,pts[nextIndex].y);
    const ax=pts[redIndex].x,ay=pts[redIndex].y,bx=pts[nextIndex].x,by=pts[nextIndex].y,midDir=Math.atan2((ay-cy)+(by-cy),(ax-cx)+(bx-cx));
    const centerAngle=360/n,roundedAngle=Math.round(centerAngle*10)/10;
    const centerAngleText=Math.abs(centerAngle-roundedAngle)<1e-10?`${roundedAngle}°`:`${centerAngle.toFixed(1)}°…`;
    ctx.fillStyle="orange";ctx.font="24px sans-serif";ctx.fillText(centerAngleText,cx+45*Math.cos(midDir),cy+45*Math.sin(midDir));
  }
  const unitSide=mode==="inner"?2*Math.sin(Math.PI/n):2*Math.tan(Math.PI/n),perimeter=n*unitSide,color=mode==="inner"?"blue":"purple";
  const parts=[{text:"多角形の周の長さ → ",color},{text:Number(perimeter.toFixed(5)).toString(),color},{text:mode==="inner"?" ＜ ":" ＞ ",color:"red"},{text:"2π ← 円周",color:"black"}];
  ctx.save();ctx.font="20px sans-serif";const width=Math.max(260,Math.ceil(parts.reduce((s,p)=>s+ctx.measureText(p.text).width,0))+20);ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(10,10,width,95);ctx.strokeStyle="#ccc";ctx.strokeRect(10,10,width,95);ctx.fillStyle="black";ctx.fillText(mode==="inner"?`内接正${n}角形`:`外接正${n}角形`,20,35);let x=20;for(const p of parts){ctx.fillStyle=p.color;ctx.fillText(p.text,x,60);x+=ctx.measureText(p.text).width}ctx.fillStyle="black";ctx.fillText(`一辺 ≒ ${unitSide.toFixed(5)}`,20,85);ctx.restore();
}

draw();
renderMission();
</script>
</body>
</html>
