<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archimedes Lab</title>
<style>
*{box-sizing:border-box}body{font-family:sans-serif;text-align:center;background:#f5f7fa;margin:0;padding:15px}.panel{background:#fff;max-width:900px;margin:10px auto;padding:12px;border-radius:10px;box-shadow:0 2px 6px #0002}canvas{background:#fff;border:1px solid #ccc;max-width:100%}button{font-size:18px;margin:5px;padding:6px 14px}button.is-active{background:#2f6fbd;color:#fff;border-color:#245892}#outerButtons{display:none}#mission{background:#fff8d6;font-size:24px;align-self:stretch}#mission h2{font-size:38px;margin:0}.mission-one{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}.mission-check{width:22px;height:22px;margin:0;accent-color:#18a84a;opacity:1;pointer-events:none}.mission-answer{width:90px;font:inherit;text-align:center;padding:3px 6px}.mission-n{white-space:nowrap}.discovery-badge{display:none;align-items:center;padding:4px 10px;border-radius:999px;background:#18a84a;color:#fff;font-size:.82em;font-weight:700;white-space:nowrap;box-shadow:0 2px 5px #18a84a47;transform-origin:center}.discovery-badge.is-visible{display:inline-flex}.discovery-badge.is-animating{animation:pop 420ms ease-out}@keyframes pop{0%{transform:scale(.72);opacity:0}55%{transform:scale(1.14);opacity:1}100%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.discovery-badge.is-animating{animation:none}}
.main-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);align-items:stretch;gap:16px;width:100%;max-width:1200px;margin:10px auto}.main-layout>.panel{width:auto;max-width:none;margin:0}.graph-panel{display:flex;align-items:flex-start;justify-content:center}.graph-panel canvas{display:block;width:100%;max-width:700px;height:auto;cursor:grab;touch-action:none}.graph-panel canvas.is-dragging{cursor:grabbing}.control-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px}.n-control,.rotation-control{display:flex;align-items:center;justify-content:center;gap:8px}#nLabel{display:inline-block;min-width:54px;font-size:20px;font-weight:700}.rotation-control label{font-size:18px;white-space:nowrap}#rotSlider{width:min(360px,42vw)}
@media(min-width:901px) and (max-height:900px){body{padding:6px}h1{font-size:clamp(22px,3.2vh,30px);margin:4px 0}.main-layout{gap:10px;margin:5px auto}.panel{margin:5px auto;padding:7px}#mission{font-size:clamp(16px,2.35vh,21px)}#mission h2{font-size:clamp(24px,3.8vh,32px)}.graph-panel canvas{width:auto;height:clamp(360px,calc(100svh - 205px),560px);max-width:100%}button{font-size:15px;margin:2px;padding:5px 10px}.control-row{gap:8px}#nLabel{font-size:18px}.rotation-control label{font-size:16px}}
@media(min-width:901px) and (max-height:680px){body{padding:3px}h1{font-size:21px;margin:1px 0}.main-layout{gap:6px;margin:3px auto}.panel{margin:3px auto;padding:5px}#mission{font-size:15px}#mission h2{font-size:21px}.graph-panel canvas{height:clamp(320px,calc(100svh - 170px),455px)}button{min-height:30px;font-size:14px;margin:1px;padding:3px 8px}.control-row{gap:5px}}
@media(max-width:900px){.main-layout{display:block;max-width:900px;margin:0 auto}.main-layout>.panel{width:auto;max-width:900px;margin:10px auto}.graph-panel{display:block}.graph-panel canvas{width:auto;max-width:100%;height:auto;margin:0 auto}}
@media(max-width:600px){body{padding:8px}h1{font-size:28px;margin:12px 0}.panel,.main-layout>.panel{margin:8px auto;padding:8px}button{min-height:44px;margin:4px;padding:8px 12px;font-size:16px}#mission{font-size:18px}#mission h2{font-size:27px}.control-row{gap:6px}.n-control,.rotation-control{width:100%}.rotation-control label{font-size:16px}#rotSlider{width:min(300px,72vw)!important;min-height:32px}canvas,.graph-panel canvas{width:100%;height:auto}}
</style></head><body>
<h1>Archimedes Lab</h1>
<div class="main-layout"><div class="panel" id="mission"></div><div class="panel graph-panel"><canvas id="cv" width="700" height="700"></canvas></div></div>
<div class="panel"><button id="innerModeButton" onclick="setMode('inner')">内接</button><button id="outerModeButton" onclick="setMode('outer')" style="display:none">外接</button><button id="trianglesButton" onclick="toggleTriangles()">三角形を見る</button><button id="centerAngleButton" onclick="toggleCenterAngle()">中心角を見る</button><button id="inscribedAngleButton" onclick="toggleInscribedAngle()">円周角を見る</button><div id="outerButtons"><button id="hButton" onclick="toggleH()">Hを見る</button><button id="tanButton" onclick="toggleTan()">AHの長さは？</button></div></div>
<div class="panel control-row"><div class="n-control"><button onclick="changeN(-1)">－</button><span id="nLabel"></span><button onclick="changeN(1)">＋</button></div><div class="rotation-control"><label for="rotSlider">回転</label><input type="range" id="rotSlider" min="-180" max="180" value="0"></div></div>
<script>
let mode="inner",n=3,showTriangles=false,showCenterAngle=false,showInscribedAngle=false,showH=false,showTan=false;
const missionAnswers={inner:""},missionChecks={step2:false,step3:false,step4:false};let outerUnlocked=false,lastPolygonPoints=[],dragging=false,dragId=null,dragStartAngle=0,dragStartValue=0;
const canvas=document.getElementById("cv"),ctx=canvas.getContext("2d"),slider=document.getElementById("rotSlider");slider.addEventListener("input",draw);
function canvasPoint(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*700/r.width,y:(e.clientY-r.top)*700/r.height}}
function segDist(p,a,b){const x=b.x-a.x,y=b.y-a.y,l=x*x+y*y;if(!l)return Math.hypot(p.x-a.x,p.y-a.y);const t=Math.max(0,Math.min(1,((p.x-a.x)*x+(p.y-a.y)*y)/l));return Math.hypot(p.x-a.x-t*x,p.y-a.y-t*y)}
function nearPolygon(p){return lastPolygonPoints.some((a,i)=>segDist(p,a,lastPolygonPoints[(i+1)%lastPolygonPoints.length])<=32)}
function normDeg(v){let x=((v+180)%360+360)%360-180;return x===-180&&v>0?180:x}
canvas.addEventListener("pointerdown",e=>{const p=canvasPoint(e);if(!nearPolygon(p))return;dragging=true;dragId=e.pointerId;dragStartAngle=Math.atan2(p.y-350,p.x-350);dragStartValue=+slider.value;canvas.classList.add("is-dragging");canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener("pointermove",e=>{if(!dragging||e.pointerId!==dragId)return;const p=canvasPoint(e),a=Math.atan2(p.y-350,p.x-350),d=Math.atan2(Math.sin(a-dragStartAngle),Math.cos(a-dragStartAngle));slider.value=normDeg(dragStartValue+d*180/Math.PI);draw();e.preventDefault()});
function endDrag(e){if(!dragging||e.pointerId!==dragId)return;dragging=false;dragId=null;canvas.classList.remove("is-dragging");if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);
function setMode(m){if(m==="outer"&&!outerUnlocked)return;if(m==="outer")showInscribedAngle=false;if(mode==="outer"&&m!=="outer"){showH=false;showTan=false}mode=m;draw();renderMission()}
function changeN(d){n=Math.max(3,Math.min(30,n+d));draw();renderMission()}function toggleTriangles(){showTriangles=!showTriangles;draw()}function toggleCenterAngle(){showCenterAngle=!showCenterAngle;draw()}function toggleInscribedAngle(){if(mode!=="inner")return;showInscribedAngle=!showInscribedAngle;draw()}function toggleH(){showH=!showH;if(!showH)showTan=false;draw()}function toggleTan(){showTan=!showTan;draw()}
function updateControls(){const inner=innerModeButton,outer=outerModeButton,tri=trianglesButton,ang=centerAngleButton,ins=inscribedAngleButton,h=hButton,tan=tanButton;outer.style.display=outerUnlocked?"inline-block":"none";inner.classList.toggle("is-active",mode==="inner");outer.classList.toggle("is-active",mode==="outer");tri.classList.toggle("is-active",showTriangles);tri.textContent=showTriangles?"三角形を隠す":"三角形を見る";ang.classList.toggle("is-active",showCenterAngle);ang.textContent=showCenterAngle?"中心角を隠す":"中心角を見る";ins.style.display=mode==="inner"?"inline-block":"none";ins.classList.toggle("is-active",showInscribedAngle);ins.textContent=showInscribedAngle?"円周角を隠す":"円周角を見る";outerButtons.style.display=mode==="outer"?"block":"none";h.classList.toggle("is-active",showH);h.textContent=showH?"Hを隠す":"Hを見る";tan.style.display=showH?"inline-block":"none";tan.classList.toggle("is-active",showTan);tan.textContent=showTan?"AHの長さを隠す":"AHの長さは？"}
function correct(v){return v!==""&&Number.isInteger(+v)&&+v>=8}function sanitizeMissionAnswer(el){const v=el.value.replace(/\D/g,"");el.value=v;missionAnswers.inner=v;const c=correct(v);mission1Check.checked=c;discoveryBadge.classList.toggle("is-visible",c);if(c){discoveryBadge.classList.remove("is-animating");void discoveryBadge.offsetWidth;discoveryBadge.classList.add("is-animating")}updateUnlock()}
function updateUnlock(){outerUnlocked=correct(missionAnswers.inner)&&missionChecks.step2&&missionChecks.step3&&missionChecks.step4;if(outerModeButton)outerModeButton.style.display=outerUnlocked?"inline-block":"none";const m=document.getElementById("unlockMessage");if(m)m.innerHTML=outerUnlocked?'<br><div style="color:#18a84a;font-weight:bold;font-size:28px">🎉 MAIN MISSION CLEAR!<br>⭐ BONUS CHALLENGE 解放！</div>':""}
function renderMission(){if(mode==="outer"){mission.innerHTML=`<h2>⭐ BONUS CHALLENGE（外接）</h2>① π ＜ 3.25 を満たす n を探せ<br><br>② 赤い辺の長さを求めよう<br><br>③ 正${n}角形の周の長さを求めよう<br><br>④ π の上限を不等式で表そう`;return}const c=correct(missionAnswers.inner);mission.innerHTML=`<h2>🎯 MAIN MISSION（内接）</h2><div class="mission-one"><input id="mission1Check" class="mission-check" type="checkbox" ${c?"checked":""} disabled><span>① 3.05＜π を満たす n を探せ</span><label class="mission-n">n＝<input id="mission1Input" class="mission-answer" type="text" inputmode="numeric" oninput="sanitizeMissionAnswer(this)"></label><span id="discoveryBadge" class="discovery-badge ${c?"is-visible":""}">✓ 発見！</span></div><br><label><input type="checkbox" id="step2Check">② 赤い辺の長さを求めた</label><br><br><label><input type="checkbox" id="step3Check">③ 正${n}角形の周の長さを求めた</label><br><br><label><input type="checkbox" id="step4Check">④ πの下限を不等式で表した</label><div id="unlockMessage"></div>`;mission1Input.value=missionAnswers.inner;["step2","step3","step4"].forEach((k,i)=>{const e=document.getElementById(`step${i+2}Check`);e.checked=missionChecks[k];e.onchange=()=>{missionChecks[k]=e.checked;updateUnlock()}});updateUnlock()}
function angleText(v){const r=Math.round(v*10)/10;return Math.abs(v-r)<1e-10?`${r}°`:`${v.toFixed(1)}°…`}
function draw(){updateControls();nLabel.textContent=`n=${n}`;ctx.clearRect(0,0,700,700);const cx=350,cy=350,baseR=230,R=mode==="outer"?Math.min(baseR,300*Math.cos(Math.PI/n)):baseR;ctx.strokeStyle="#ddd";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(700,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,700);ctx.stroke();ctx.beginPath();ctx.arc(cx,cy,R,0,2*Math.PI);ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.stroke();
const ri=Math.floor(n/2)-1,ni=(ri+1)%n,baseRot=Math.PI/2-(ri+.5)*2*Math.PI/n,rot=baseRot+(+slider.value)*Math.PI/180;let finalRot=rot,drawR=mode==="inner"?R:R/Math.cos(Math.PI/n);if(mode==="inner"){const ba=rot+2*Math.PI*ni/n,bx=Math.cos(ba),by=Math.sin(ba);if(Math.abs(bx-1)<.10&&Math.abs(by)<.10)finalRot=-2*Math.PI*ni/n;const ma=rot+(ri+.5)*2*Math.PI/n,mx=Math.cos(ma),my=Math.sin(ma);if(mx>.6&&Math.abs(my)<.08)finalRot=-(ri+.5)*2*Math.PI/n}else{const ma=rot+(ri+.5)*2*Math.PI/n,mx=Math.cos(ma),my=Math.sin(ma);if(Math.abs(mx-1)<.10&&Math.abs(my)<.10)finalRot=-(ri+.5)*2*Math.PI/n}
const pts=[];for(let i=0;i<n;i++){const t=finalRot+2*Math.PI*i/n;pts.push({x:cx+drawR*Math.cos(t),y:cy+drawR*Math.sin(t)})}lastPolygonPoints=pts.map(p=>({...p}));if(showTriangles){ctx.strokeStyle="#888";ctx.lineWidth=1;for(const p of pts){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(p.x,p.y);ctx.stroke()}ctx.fillStyle="#000";ctx.beginPath();ctx.arc(cx,cy,4,0,2*Math.PI);ctx.fill();ctx.font="20px sans-serif";ctx.fillText("O",cx+10,cy-10)}ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<n;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.strokeStyle=mode==="inner"?"blue":"purple";ctx.lineWidth=2;ctx.stroke();ctx.fillStyle="#000";ctx.font="18px sans-serif";ctx.fillText("1",cx+R+15,cy+20);ctx.fillText("-1",cx-R-35,cy+20);ctx.fillText("1",cx-25,cy-R-10);ctx.fillText("-1",cx-30,cy+R+25);const A=pts[ri],B=pts[ni],mx=(A.x+B.x)/2,my=(A.y+B.y)/2;ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.strokeStyle="red";ctx.lineWidth=6;ctx.stroke();ctx.fillStyle="red";ctx.beginPath();ctx.arc(mx,my,5,0,2*Math.PI);ctx.fill();
if(mode==="outer"&&showH){ctx.fillStyle="green";ctx.beginPath();ctx.arc(mx,my,6,0,2*Math.PI);ctx.fill();ctx.font="22px sans-serif";ctx.fillText("H",mx+10,my)}if(mode==="outer"&&showTan){ctx.fillStyle="green";ctx.font="24px sans-serif";ctx.fillText("tanθ",(A.x+mx)/2,(A.y+my)/2)}
if(showCenterAngle){ctx.strokeStyle="orange";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.closePath();ctx.stroke();const aa=Math.atan2(A.y-cy,A.x-cx),ab=Math.atan2(B.y-cy,B.x-cx),mid=Math.atan2((A.y-cy)+(B.y-cy),(A.x-cx)+(B.x-cx));ctx.beginPath();ctx.arc(cx,cy,35,aa,ab);ctx.strokeStyle="orange";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#000";ctx.font="22px sans-serif";ctx.fillText("O",cx+10,cy-10);ctx.fillText("A",A.x+10,A.y);ctx.fillText("B",B.x+10,B.y);ctx.fillStyle="orange";ctx.font="24px sans-serif";ctx.fillText(angleText(360/n),cx+45*Math.cos(mid),cy+45*Math.sin(mid))}
if(mode==="inner"&&showInscribedAngle){const midMinor=Math.atan2((A.y-cy)+(B.y-cy),(A.x-cx)+(B.x-cx)),ca=midMinor+Math.PI,C={x:cx+R*Math.cos(ca),y:cy+R*Math.sin(ca)};ctx.save();ctx.strokeStyle="#00a6a6";ctx.fillStyle="#00a6a6";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(C.x,C.y);ctx.lineTo(A.x,A.y);ctx.moveTo(C.x,C.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.beginPath();ctx.arc(C.x,C.y,6,0,2*Math.PI);ctx.fill();ctx.font="22px sans-serif";ctx.fillText("C",C.x+10,C.y-8);let s=Math.atan2(A.y-C.y,A.x-C.x),e=Math.atan2(B.y-C.y,B.x-C.x),d=((e-s)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);if(d>Math.PI){[s,e]=[e,s];d=((e-s)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)}ctx.beginPath();ctx.arc(C.x,C.y,34,s,s+d);ctx.stroke();const bis=s+d/2;ctx.font="22px sans-serif";ctx.fillText(angleText(180/n),C.x+47*Math.cos(bis)-12,C.y+47*Math.sin(bis)+7);if(showCenterAngle){const text="中心角 ＝ 円周角の2倍";ctx.font="bold 19px sans-serif";const w=ctx.measureText(text).width+20;ctx.fillStyle="#ffffffe6";ctx.fillRect(690-w,12,w,34);ctx.strokeStyle="#00a6a6";ctx.lineWidth=1;ctx.strokeRect(690-w,12,w,34);ctx.fillStyle="#007c7c";ctx.fillText(text,700-w,35)}ctx.restore()}
const side=mode==="inner"?2*Math.sin(Math.PI/n):2*Math.tan(Math.PI/n),per=n*side,col=mode==="inner"?"blue":"purple",parts=[{t:"多角形の周の長さ → ",c:col},{t:Number(per.toFixed(5)).toString(),c:col},{t:mode==="inner"?" ＜ ":" ＞ ",c:"red"},{t:"2π ← 円周",c:"black"}];ctx.save();ctx.font="20px sans-serif";const w=Math.max(260,Math.ceil(parts.reduce((z,p)=>z+ctx.measureText(p.t).width,0))+20);ctx.fillStyle="#ffffffd9";ctx.fillRect(10,10,w,95);ctx.strokeStyle="#ccc";ctx.strokeRect(10,10,w,95);ctx.fillStyle="#000";ctx.fillText(`${mode==="inner"?"内接":"外接"}正${n}角形`,20,35);let x=20;for(const p of parts){ctx.fillStyle=p.c;ctx.fillText(p.t,x,60);x+=ctx.measureText(p.t).width}ctx.fillStyle="#000";ctx.fillText(`一辺 ≒ ${side.toFixed(5)}`,20,85);ctx.restore()}
draw();renderMission();
</script></body></html>
