<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archimedes Lab</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f7fa;
    margin:0;
    padding:15px;
}

.panel{
    background:white;
    max-width:900px;
    margin:10px auto;
    padding:12px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

canvas{
    background:white;
    border:1px solid #ccc;
    max-width:100%;
}

button{
    font-size:18px;
    margin:5px;
    padding:6px 14px;
}

button.is-active{
    background:#2f6fbd;
    color:white;
    border-color:#245892;
}

#outerButtons{
    display:none;
}

@media (max-width:600px){
    body{
        padding:8px;
    }

    h1{
        font-size:28px;
        margin:12px 0;
    }

    .panel{
        margin:8px auto;
        padding:8px;
    }

    button{
        min-height:44px;
        margin:4px;
        padding:8px 12px;
        font-size:16px;
    }

    #mission{
        font-size:18px;
    }

    #mission h2{
        font-size:27px;
    }

    #rotSlider{
        width:min(300px, 78vw) !important;
        min-height:32px;
        vertical-align:middle;
    }

    canvas{
        width:100%;
        height:auto;
    }
}

#mission{
    background:#fff8d6;
    font-size:24px;
}

#mission h2{
    font-size:38px;
    margin:0;
}

.mission-one{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

.mission-check{
    width:22px;
    height:22px;
    margin:0;
    accent-color:#18a84a;
    opacity:1;
    pointer-events:none;
}

.mission-answer{
    width:90px;
    font:inherit;
    text-align:center;
    padding:3px 6px;
    box-sizing:border-box;
}

.mission-n{
    white-space:nowrap;
}

.discovery-badge{
    display:none;
    align-items:center;
    padding:4px 10px;
    border-radius:999px;
    background:#18a84a;
    color:white;
    font-size:0.82em;
    font-weight:700;
    line-height:1.2;
    white-space:nowrap;
    box-shadow:0 2px 5px rgba(24,168,74,0.28);
    transform-origin:center;
}

.discovery-badge.is-visible{
    display:inline-flex;
}

.discovery-badge.is-animating{
    animation:discovery-pop 420ms ease-out;
}

@keyframes discovery-pop{
    0%{
        transform:scale(0.72);
        opacity:0;
    }
    55%{
        transform:scale(1.14);
        opacity:1;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

@media (prefers-reduced-motion:reduce){
    .discovery-badge.is-animating{
        animation:none;
    }
}

/* PC・横向きタブレット：ミッションとグラフを左右配置 */
.main-layout{
    display:grid;
    grid-template-columns:minmax(0, 2fr) minmax(0, 3fr);
    align-items:stretch;
    gap:16px;
    width:100%;
    max-width:1200px;
    margin:10px auto;
}

.main-layout > .panel{
    width:auto;
    max-width:none;
    margin:0;
    box-sizing:border-box;
}

#mission{
    align-self:stretch;
}

.graph-panel{
    display:flex;
    align-items:flex-start;
    justify-content:center;
}

.graph-panel canvas{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
}

/* スマートフォン・縦向きタブレット：従来の縦配置 */
@media (max-width:900px){
    .main-layout{
        display:block;
        max-width:900px;
        margin:0 auto;
    }

    .main-layout > .panel{
        width:auto;
        max-width:900px;
        margin:10px auto;
    }

    #mission{
        min-height:0;
    }

    .graph-panel{
        display:block;
        text-align:center;
    }

    .graph-panel canvas{
        width:auto;
        max-width:100%;
        height:auto;
        margin:0 auto;
    }
}

@media (max-width:600px){
    .main-layout > .panel{
        margin:8px auto;
        padding:8px;
    }

    #mission{
        font-size:18px;
    }

    #mission h2{
        font-size:27px;
    }

    .graph-panel canvas{
        width:100%;
    }
}

</style>

</head>
<body>

<h1>Archimedes Lab</h1>

<div class="main-layout">

<div class="panel" id="mission"></div>

<div class="panel graph-panel">

<canvas
id="cv"
width="700"
height="700">
</canvas>

</div>

</div>

<div class="panel">

<button id="innerModeButton" type="button" onclick="setMode('inner')">
内接
</button>

<button
id="outerModeButton"
type="button"
onclick="setMode('outer')"
style="display:none">
外接
</button>

<button id="trianglesButton" type="button" onclick="toggleTriangles()">
三角形を見る
</button>

<button id="centerAngleButton" type="button" onclick="toggleCenterAngle()">
中心角を見る
</button>

<div id="outerButtons">
<button id="hButton" type="button" onclick="toggleH()">
Hを見る
</button>

<button id="tanButton" type="button" onclick="toggleTan()">
AHの長さは？
</button>
</div>

</div>

<div class="panel">

<button onclick="n=Math.max(3,n-1);draw()">
－
</button>

<span id="nLabel"></span>

<button onclick="n=Math.min(30,n+1);draw()">
＋
</button>

</div>

<div class="panel">

回転

<input
type="range"
id="rotSlider"
min="-180"
max="180"
value="0"
style="width:300px">

</div>
 
<script>

let mode="inner";
let n=3;
let showTriangles=false;
let showCenterAngle=false;

let showH=false;
let showTan=false;

const missionAnswers={
    inner:"",
    outer:""
};
const missionChecks={
step2:false,
step3:false,
step4:false
};

let outerUnlocked=false;

const canvas=
document.getElementById("cv");

const ctx=
canvas.getContext("2d");

const slider=
document.getElementById("rotSlider");

slider.addEventListener("input",draw);

function setMode(nextMode){
    if(mode === "outer" && nextMode !== "outer"){
        showH=false;
        showTan=false;
    }
    mode=nextMode;
    draw();
}

function toggleTriangles(){
    showTriangles=!showTriangles;
    draw();
}

function toggleCenterAngle(){
    showCenterAngle=!showCenterAngle;
    draw();
}

function toggleH(){
    showH=!showH;
    if(!showH){
        showTan=false;
    }
    draw();
}

function toggleTan(){
    showTan=!showTan;
    draw();
}

function updateControls(){
    const innerModeButton=document.getElementById("innerModeButton");
    const outerModeButton=document.getElementById("outerModeButton");
    const trianglesButton=document.getElementById("trianglesButton");
    const centerAngleButton=document.getElementById("centerAngleButton");
    const outerButtons=document.getElementById("outerButtons");
    const hButton=document.getElementById("hButton");
    const tanButton=document.getElementById("tanButton");

    innerModeButton.classList.toggle("is-active", mode === "inner");
    outerModeButton.classList.toggle("is-active", mode === "outer");
    innerModeButton.setAttribute("aria-pressed", String(mode === "inner"));
    outerModeButton.setAttribute("aria-pressed", String(mode === "outer"));

    trianglesButton.classList.toggle("is-active", showTriangles);
    trianglesButton.textContent=showTriangles ? "三角形を隠す" : "三角形を見る";
    trianglesButton.setAttribute("aria-pressed", String(showTriangles));

    centerAngleButton.classList.toggle("is-active", showCenterAngle);
    centerAngleButton.textContent=showCenterAngle ? "中心角を隠す" : "中心角を見る";
    centerAngleButton.setAttribute("aria-pressed", String(showCenterAngle));

    outerButtons.style.display=mode === "outer" ? "block" : "none";

    hButton.classList.toggle("is-active", showH);
    hButton.textContent=showH ? "Hを隠す" : "Hを見る";
    hButton.setAttribute("aria-pressed", String(showH));

    tanButton.style.display=showH ? "inline-block" : "none";
    tanButton.classList.toggle("is-active", showTan);
    tanButton.textContent=showTan ? "AHの長さを隠す" : "AHの長さは？";
    tanButton.setAttribute("aria-pressed", String(showTan));
}

function isMissionAnswerCorrect(targetMode,value){
    if(value === ""){
        return false;
    }

    const numericValue=Number(value);
    const isInteger=Number.isInteger(numericValue);
    const isPolygonSideCount=numericValue>=3;
    const threshold=targetMode === "inner" ? 8 : 10;

    return isInteger && isPolygonSideCount && numericValue>=threshold;
}

function preventMissionSpinnerKeys(event){
    if(event.key === "ArrowUp" || event.key === "ArrowDown"){
        event.preventDefault();
    }
}

function sanitizeMissionAnswer(input){

    const digitsOnly=input.value.replace(/[^0-9]/g,"");

    if(input.value !== digitsOnly){
        input.value=digitsOnly;
    }

    updateMissionAnswer(digitsOnly);

}
function updateOuterUnlock(){

    const mission1=
    isMissionAnswerCorrect(
        "inner",
        missionAnswers.inner
    );

    outerUnlocked=
        mission1 &&
        missionChecks.step2 &&
        missionChecks.step3 &&
        missionChecks.step4;

    const outerButton=
    document.getElementById(
        "outerModeButton"
    );

    if(outerButton){

        outerButton.style.display=
            outerUnlocked
            ? "inline-block"
            : "none";

    }

}
    
function animateDiscoveryBadge(badge){

    badge.classList.remove("is-animating");
    void badge.offsetWidth;
    badge.classList.add("is-animating");
}

function updateMissionAnswer(value){
    missionAnswers[mode]=value;

    const isCorrect=isMissionAnswerCorrect(mode,value);
    const missionCheck=document.getElementById("mission1Check");
    const discoveryBadge=document.getElementById("discoveryBadge");

    if(missionCheck){
        missionCheck.checked=isCorrect;
    }

    if(discoveryBadge){
        discoveryBadge.classList.toggle("is-visible",isCorrect);

        if(isCorrect){
            animateDiscoveryBadge(discoveryBadge);
        }else{
            discoveryBadge.classList.remove("is-animating");
        }
    }
    updateOuterUnlock();
}

function renderMission(){
　　 const isInner=mode === "inner";
if(!isInner){

document.getElementById("mission").innerHTML=`
<h2>⭐ BONUS CHALLENGE（外接）</h2>

① π ＜ 3.25 を満たす n を探せ

<br><br>

② 赤い辺の長さを求めよう

<br><br>

③ 正${n}角形の周の長さを求めよう

<br><br>

④ π の上限を不等式で表そう
`;

return;

}    
   
    const missionTitle=isInner
        ? "🎯 MAIN MISSION（内接）"
        : "⭐ BONUS CHALLENGE（外接）";
    const missionText=isInner
        ? "① 3.05 ＜ π を満たす n の値を探せ"
        : "① π ＜ 3.25 を満たす n の値を探せ";
    const lastMission=isInner
        ? "□ ④ 円周率 π の下限を不等式で表そう"
        : "□ ④ 円周率 π の上限を不等式で表そう";

if(isInner){

const mission1=
isMissionAnswerCorrect(
"inner",
missionAnswers.inner
);

document.getElementById("mission").innerHTML=
`
<h2>🎯 MAIN MISSION（内接）</h2>

<div class="mission-one">
<input
id="mission1Check"
class="mission-check"
type="checkbox"
${mission1 ? "checked" : ""}
disabled>

<span>
① 3.05＜π を満たす n を探せ
</span>

<label class="mission-n">
n＝
<input
id="mission1Input"
class="mission-answer"
type="text"
inputmode="numeric"
oninput="sanitizeMissionAnswer(this)">
</label>

<span
id="discoveryBadge"
class="discovery-badge
${mission1 ? "is-visible" : ""}">
✓ 発見！
</span>
</div>

<br>

<label>
<input
type="checkbox"
id="step2Check">
② 赤い辺の長さを求めた
</label>

<br><br>

<label>
<input
type="checkbox"
id="step3Check">
③ 正${n}角形の周の長さを求めた
</label>

<br><br>

<label>
<input
type="checkbox"
id="step4Check">
④ πの下限を不等式で表した
</label>

<div id="unlockMessage"></div>
`;

}

    const input=document.getElementById("mission1Input");
    const check=document.getElementById("mission1Check");
    const discoveryBadge=document.getElementById("discoveryBadge");
    const isCorrect=isMissionAnswerCorrect(mode,missionAnswers[mode]);
if(!input || !check || !discoveryBadge){
    return;
}
    input.value=missionAnswers[mode];
    check.checked=isCorrect;
    discoveryBadge.classList.toggle("is-visible",isCorrect);
    ["step2","step3","step4"]
.forEach((key,index)=>{

const el=
document.getElementById(
`step${index+2}Check`
);

if(!el) return;

el.checked=
missionChecks[key];

el.addEventListener(
"change",
()=>{
missionChecks[key]=
el.checked;

updateOuterUnlock();
renderMission();
}
);

});
if(outerUnlocked){

const msg=
document.getElementById(
"unlockMessage"
);

msg.innerHTML=
`
<br>
<div style="
color:#18a84a;
font-weight:bold;
font-size:28px;">
🎉 MAIN MISSION CLEAR!
<br>
⭐ BONUS CHALLENGE 解放！
</div>
`;
}    
}

function draw(){
updateControls();

document.getElementById("nLabel")
.innerHTML=
`n=${n}`;

ctx.clearRect(0,0,700,700);

const cx=350;
const cy=350;

/*
 * 外接多角形がCanvas外へはみ出さないように自動倍率調整する。
 * 通常は円の半径230pxを維持し、外接多角形の頂点半径が300pxを
 * 超える場合だけ、円と多角形を相似のまま一体で縮小する。
 */
const baseR=230;
const maxOuterVertexR=300;
const R = mode === "outer"
    ? Math.min(baseR, maxOuterVertexR * Math.cos(Math.PI / n))
    : baseR;

ctx.strokeStyle="#ddd";

ctx.beginPath();
ctx.moveTo(0,cy);
ctx.lineTo(700,cy);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(cx,0);
ctx.lineTo(cx,700);
ctx.stroke();

ctx.beginPath();
ctx.arc(cx,cy,R,0,2*Math.PI);
ctx.strokeStyle="black";
ctx.lineWidth=2;
ctx.stroke();

/* 赤い辺 */

const redIndex =
Math.floor(n/2)-1;

const nextIndex =
(redIndex+1)%n;

/* 赤い辺の中点を真下にする基本角 */

const edgeMidAngle =
(redIndex+0.5)
*
(2*Math.PI/n);

const baseRot =
Math.PI/2
-
edgeMidAngle;

const userRot =
Number(slider.value)
*
Math.PI/180;

const rot =
baseRot+userRot;
let finalRot = rot;
 
const pts=[];

let drawR;

if(mode==="inner"){

    drawR = R;

}else{

    drawR =
    R/Math.cos(Math.PI/n);

}

if(mode==="inner"){

    const bAngle =
    rot +
    2*Math.PI*nextIndex/n;

    const bx =
    Math.cos(bAngle);

    const by =
    Math.sin(bAngle);

    /* 強吸着 */

    if(
        Math.abs(bx-1)<0.10 &&
        Math.abs(by)<0.10
    ){

        finalRot =
        -2*Math.PI*nextIndex/n;

    }

    /* 弱吸着 */

const midAngle =
rot +
(redIndex+0.5)
*
2*Math.PI/n;

const mxUnit =
Math.cos(midAngle);

const myUnit =
Math.sin(midAngle);

if(
    mxUnit > 0.6 &&
    Math.abs(myUnit)<0.08
){

    finalRot =
    -(redIndex+0.5)
    *
    2*Math.PI/n;

}
}

if(mode==="outer"){

    const midAngle =
    rot +
    (
      (redIndex+0.5)
      *
      2*Math.PI/n
    );

    const mxUnit =
    Math.cos(midAngle);

    const myUnit =
    Math.sin(midAngle);

    if(
        Math.abs(mxUnit-1)<0.10 &&
        Math.abs(myUnit)<0.10
    ){

        finalRot =
        -(redIndex+0.5)
        *
        2*Math.PI/n;

    }

}
 
for(let i=0;i<n;i++){

    const t =
  finalRot +
  2*Math.PI*i/n;

    pts.push({

        x:
        cx+
        drawR*Math.cos(t),

        y:
        cy+
        drawR*Math.sin(t)

    });

}

/* n個の二等辺三角形 */

if(showTriangles){

    ctx.strokeStyle="#888";
    ctx.lineWidth=1;

    for(let i=0;i<n;i++){

        ctx.beginPath();

        ctx.moveTo(
        cx,
        cy
        );

        ctx.lineTo(
        pts[i].x,
        pts[i].y
        );

        ctx.stroke();

    }

    ctx.beginPath();

    ctx.arc(
    cx,
    cy,
    4,
    0,
    2*Math.PI
    );

    ctx.fillStyle="black";
    ctx.fill();

    ctx.font="20px sans-serif";

    ctx.fillText(
    "O",
    cx+10,
    cy-10
    );

}

/* 多角形 */

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<n;i++){

    ctx.lineTo(
    pts[i].x,
    pts[i].y
    );

}

ctx.closePath();

ctx.strokeStyle=
mode==="inner"
?
"blue"
:
"purple";

ctx.lineWidth=2;

ctx.stroke();

/* 単位円の目盛 */

ctx.fillStyle="black";
ctx.font="18px sans-serif";

/* x軸 */

ctx.fillText(
    "1",
    cx + R + 15,
    cy + 20
);

ctx.fillText(
    "-1",
    cx - R - 35,
    cy + 20
);

/* y軸 */

ctx.fillText(
    "1",
    cx - 25,
    cy - R - 10
);

ctx.fillText(
    "-1",
    cx - 30,
    cy + R + 25
);

/* 赤い辺 */

ctx.beginPath();

ctx.moveTo(
pts[redIndex].x,
pts[redIndex].y
);

ctx.lineTo(
pts[nextIndex].x,
pts[nextIndex].y
);

ctx.lineWidth=6;
ctx.strokeStyle="red";
ctx.stroke();

/* 赤い辺の中点 */

const mx =
(
pts[redIndex].x+
pts[nextIndex].x
)/2;

const my =
(
pts[redIndex].y+
pts[nextIndex].y
)/2;

if(
    mode==="outer" &&
    showH
){

    ctx.fillStyle="green";

    ctx.beginPath();
    ctx.arc(mx,my,6,0,2*Math.PI);
    ctx.fill();

    ctx.font="22px sans-serif";

    ctx.fillText(
        "H",
        mx+10,
        my
    );

}
if(
    mode==="outer" &&
    showTan
){

    const tx =
    (pts[redIndex].x + mx)/2;

    const ty =
    (pts[redIndex].y + my)/2;

    ctx.fillStyle="green";
    ctx.font="24px sans-serif";

    ctx.fillText(
        "tanθ",
        tx,
        ty
    );

}
 
ctx.beginPath();
ctx.arc(mx,my,5,0,2*Math.PI);
ctx.fillStyle="red";
ctx.fill();

/* 注目する三角形 */

if(showCenterAngle){

    ctx.strokeStyle="orange";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        pts[redIndex].x,
        pts[redIndex].y
    );

    ctx.lineTo(
        pts[nextIndex].x,
        pts[nextIndex].y
    );

    ctx.closePath();
    ctx.stroke();
    /* 中心角の円弧 */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    35,
    Math.atan2(
        pts[redIndex].y-cy,
        pts[redIndex].x-cx
    ),
    Math.atan2(
        pts[nextIndex].y-cy,
        pts[nextIndex].x-cx
    )
);

ctx.strokeStyle="orange";
ctx.lineWidth=3;
ctx.stroke();

    ctx.fillStyle="black";
    ctx.font="22px sans-serif";

    ctx.fillText(
        "O",
        cx+10,
        cy-10
    );

    ctx.fillText(
        "A",
        pts[redIndex].x+10,
        pts[redIndex].y
    );

    ctx.fillText(
        "B",
        pts[nextIndex].x+10,
        pts[nextIndex].y
    );

    ctx.fillStyle="orange";
    ctx.font="24px sans-serif";

    const ax = pts[redIndex].x;
const ay = pts[redIndex].y;

const bx = pts[nextIndex].x;
const by = pts[nextIndex].y;

/* OAとOBの間の方向 */

const midDir =
Math.atan2(
    (ay-cy)+(by-cy),
    (ax-cx)+(bx-cx)
);

const angleTextRadius = 45;

ctx.fillText(
    (360/n).toFixed(0)+"°",
    cx +
    angleTextRadius*Math.cos(midDir),

    cy +
    angleTextRadius*Math.sin(midDir)
);

}
 
/* 多角形の周の長さと単位円の円周を比較 */

const unitSide = mode === "inner"
    ? 2*Math.sin(Math.PI/n)
    : 2*Math.tan(Math.PI/n);

const polygonPerimeter = n*unitSide;

const formatPerimeter = value =>
    Number(value.toFixed(5)).toString();

const polygonColor =
    mode === "inner"
    ? "blue"
    : "purple";

const comparisonParts = [
    {
        text:"多角形の周の長さ → ",
        color:polygonColor
    },
    {
        text:formatPerimeter(polygonPerimeter),
        color:polygonColor
    },
    {
        text:mode === "inner" ? " ＜ " : " ＞ ",
        color:"red"
    },
    {
        text:"2π ← 円周",
        color:"black"
    }
];

/* 図の中に情報表示 */

ctx.save();
ctx.font="20px sans-serif";

const comparisonWidth =
    comparisonParts.reduce(
        (sum,part) => sum+ctx.measureText(part.text).width,
        0
    );

const infoBoxWidth =
    Math.max(260, Math.ceil(comparisonWidth)+20);

ctx.fillStyle="rgba(255,255,255,0.85)";
ctx.fillRect(10,10,infoBoxWidth,95);

ctx.strokeStyle="#ccc";
ctx.strokeRect(10,10,infoBoxWidth,95);

ctx.fillStyle="black";
ctx.font="20px sans-serif";

ctx.fillText(
    mode === "inner"
    ? `内接正${n}角形`
    : `外接正${n}角形`,
    20,
    35
);

let comparisonX = 20;
comparisonParts.forEach(part => {
    ctx.fillStyle=part.color;
    ctx.fillText(
        part.text,
        comparisonX,
        60
    );
    comparisonX+=ctx.measureText(part.text).width;
});

ctx.fillStyle="black";
ctx.fillText(
    `一辺 ≒ ${unitSide.toFixed(5)}`,
    20,
    85
);

ctx.restore();

/***** ミッション表示 *****/

renderMission();
}

draw();

</script>

</body>
</html>
