<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archimedes Lab</title>

<style>

body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f7fa;
    margin:0;
    padding:15px;
}

.panel{
    background:white;
    max-width:900px;
    margin:10px auto;
    padding:12px;
    border-radius:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

canvas{
    background:white;
    border:1px solid #ccc;
    max-width:100%;
}

button{
    font-size:22px;
    margin:5px;
    padding:6px 14px;
}

</style>

</head>
<body>

<h1>Archimedes Lab</h1>
<div class="panel" id="mission"></div>

<div class="panel">

<canvas
id="cv"
width="700"
height="700">
</canvas>

</div>

<div class="panel">

<button onclick="mode='inner';draw()">
内接
</button>

<button onclick="mode='outer';draw()">
外接
</button>

<button onclick="
showTriangles=!showTriangles;
draw();
">
三角形を見る
</button>

<button onclick="
showCenterAngle=!showCenterAngle;
draw();
">
中心角を見る
</button>

<div id="outerButtons"></div>

</div>

<div class="panel">

<button onclick="n=Math.max(3,n-1);draw()">
－
</button>

<span id="nLabel"></span>

<button onclick="n=Math.min(30,n+1);draw()">
＋
</button>

</div>

<div class="panel">

回転

<input
type="range"
id="rotSlider"
min="-180"
max="180"
value="0"
style="width:300px">

</div>
    
<script>

let mode="inner";
let n=3;
let showTriangles=false;
let showCenterAngle=false;

let showH=false;
let showTan=false;

const canvas=
document.getElementById("cv");

const ctx=
canvas.getContext("2d");

const slider=
document.getElementById("rotSlider");

slider.addEventListener("input",draw);

function draw(){

document.getElementById("nLabel")
.innerHTML=
`n=${n}`;

ctx.clearRect(0,0,700,700);

const cx=350;
const cy=350;
const R=230;

ctx.strokeStyle="#ddd";

ctx.beginPath();
ctx.moveTo(0,cy);
ctx.lineTo(700,cy);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(cx,0);
ctx.lineTo(cx,700);
ctx.stroke();

ctx.beginPath();
ctx.arc(cx,cy,R,0,2*Math.PI);
ctx.strokeStyle="black";
ctx.lineWidth=2;
ctx.stroke();

/* 赤い辺 */

const redIndex =
Math.floor(n/2)-1;

const nextIndex =
(redIndex+1)%n;

/* 赤い辺の中点を真下にする基本角 */

const edgeMidAngle =
(redIndex+0.5)
*
(2*Math.PI/n);

const baseRot =
Math.PI/2
-
edgeMidAngle;

const userRot =
Number(slider.value)
*
Math.PI/180;

const rot =
baseRot+userRot;
let finalRot = rot;
    
const pts=[];

let drawR;

if(mode==="inner"){

    drawR = R;

}else{

    drawR =
    R/Math.cos(Math.PI/n);

}

if(mode==="inner"){

    const bAngle =
    rot +
    2*Math.PI*nextIndex/n;

    const bx =
    Math.cos(bAngle);

    const by =
    Math.sin(bAngle);

    /* 強吸着 */

    if(
        Math.abs(bx-1)<0.10 &&
        Math.abs(by)<0.10
    ){

        finalRot =
        -2*Math.PI*nextIndex/n;

    }

    /* 弱吸着 */

    const midAngle =
    rot +
    (redIndex+0.5)
    *
    2*Math.PI/n;

    const myUnit =
    Math.sin(midAngle);

    if(
        Math.abs(myUnit)<0.07
    ){

        finalRot =
        -(redIndex+0.5)
        *
        2*Math.PI/n;

    }

}
if(mode==="outer"){

    document.getElementById("outerButtons")
    .innerHTML=
    `
    <button onclick="
    showH=!showH;
    draw();
    ">
    Hを見る
    </button>

    ${
        showH
        ?
        `
        <button onclick="
        showTan=!showTan;
        draw();
        ">
        AHの長さは？
        </button>
        `
        :
        ""
    }
    `;

}
else{

    document.getElementById("outerButtons")
    .innerHTML="";

}
``    
    
if(mode==="outer"){

    const midAngle =
    rot +
    (
      (redIndex+0.5)
      *
      2*Math.PI/n
    );

    const mxUnit =
    Math.cos(midAngle);

    const myUnit =
    Math.sin(midAngle);

    if(
        Math.abs(mxUnit-1)<0.10 &&
        Math.abs(myUnit)<0.10
    ){

        finalRot =
        -(redIndex+0.5)
        *
        2*Math.PI/n;

    }

}
    
for(let i=0;i<n;i++){

    const t =
　　finalRot +
　　2*Math.PI*i/n;

    pts.push({

        x:
        cx+
        drawR*Math.cos(t),

        y:
        cy+
        drawR*Math.sin(t)

    });

}

/* n個の二等辺三角形 */

if(showTriangles){

    ctx.strokeStyle="#888";
    ctx.lineWidth=1;

    for(let i=0;i<n;i++){

        ctx.beginPath();

        ctx.moveTo(
        cx,
        cy
        );

        ctx.lineTo(
        pts[i].x,
        pts[i].y
        );

        ctx.stroke();

    }

    ctx.beginPath();

    ctx.arc(
    cx,
    cy,
    4,
    0,
    2*Math.PI
    );

    ctx.fillStyle="black";
    ctx.fill();

    ctx.font="20px sans-serif";

    ctx.fillText(
    "O",
    cx+10,
    cy-10
    );

}

/* 多角形 */

ctx.beginPath();

ctx.moveTo(
pts[0].x,
pts[0].y
);

for(let i=1;i<n;i++){

    ctx.lineTo(
    pts[i].x,
    pts[i].y
    );

}

ctx.closePath();

ctx.strokeStyle=
mode==="inner"
?
"blue"
:
"purple";

ctx.lineWidth=2;

ctx.stroke();

/* 単位円の目盛 */

ctx.fillStyle="black";
ctx.font="18px sans-serif";

/* x軸 */

ctx.fillText(
    "1",
    cx + R + 15,
    cy + 20
);

ctx.fillText(
    "-1",
    cx - R - 35,
    cy + 20
);

/* y軸 */

ctx.fillText(
    "1",
    cx - 25,
    cy - R - 10
);

ctx.fillText(
    "-1",
    cx - 30,
    cy + R + 25
);

/* 赤い辺 */

ctx.beginPath();

ctx.moveTo(
pts[redIndex].x,
pts[redIndex].y
);

ctx.lineTo(
pts[nextIndex].x,
pts[nextIndex].y
);

ctx.lineWidth=6;
ctx.strokeStyle="red";
ctx.stroke();

/* 赤い辺の中点 */

const mx =
(
pts[redIndex].x+
pts[nextIndex].x
)/2;

const my =
(
pts[redIndex].y+
pts[nextIndex].y
)/2;

if(
    mode==="outer" &&
    showH
){

    ctx.fillStyle="green";

    ctx.beginPath();
    ctx.arc(mx,my,6,0,2*Math.PI);
    ctx.fill();

    ctx.font="22px sans-serif";

    ctx.fillText(
        "H",
        mx+10,
        my
    );

}
if(
    mode==="outer" &&
    showTan
){

    const tx =
    (pts[redIndex].x + mx)/2;

    const ty =
    (pts[redIndex].y + my)/2;

    ctx.fillStyle="green";
    ctx.font="24px sans-serif";

    ctx.fillText(
        "tanθ",
        tx,
        ty
    );

}
    
ctx.beginPath();
ctx.arc(mx,my,5,0,2*Math.PI);
ctx.fillStyle="red";
ctx.fill();

/* 注目する三角形 */

if(showCenterAngle){

    ctx.strokeStyle="orange";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(
        cx,
        cy
    );

    ctx.lineTo(
        pts[redIndex].x,
        pts[redIndex].y
    );

    ctx.lineTo(
        pts[nextIndex].x,
        pts[nextIndex].y
    );

    ctx.closePath();
    ctx.stroke();
    /* 中心角の円弧 */

ctx.beginPath();

ctx.arc(
    cx,
    cy,
    35,
    Math.atan2(
        pts[redIndex].y-cy,
        pts[redIndex].x-cx
    ),
    Math.atan2(
        pts[nextIndex].y-cy,
        pts[nextIndex].x-cx
    )
);

ctx.strokeStyle="orange";
ctx.lineWidth=3;
ctx.stroke();

    ctx.fillStyle="black";
    ctx.font="22px sans-serif";

    ctx.fillText(
        "O",
        cx+10,
        cy-10
    );

    ctx.fillText(
        "A",
        pts[redIndex].x+10,
        pts[redIndex].y
    );

    ctx.fillText(
        "B",
        pts[nextIndex].x+10,
        pts[nextIndex].y
    );

    ctx.fillStyle="orange";
    ctx.font="24px sans-serif";

    const ax = pts[redIndex].x;
const ay = pts[redIndex].y;

const bx = pts[nextIndex].x;
const by = pts[nextIndex].y;

/* OAとOBの間の方向 */

const midDir =
Math.atan2(
    (ay-cy)+(by-cy),
    (ax-cx)+(bx-cx)
);

const angleTextRadius = 45;

ctx.fillText(
    (360/n).toFixed(0)+"°",
    cx +
    angleTextRadius*Math.cos(midDir),

    cy +
    angleTextRadius*Math.sin(midDir)
);

}
    
/* 図の中に情報表示 */

ctx.fillStyle="rgba(255,255,255,0.85)";
ctx.fillRect(10,10,260,95);

ctx.strokeStyle="#ccc";
ctx.strokeRect(10,10,260,95);

ctx.fillStyle="black";
ctx.font="20px sans-serif";

if(mode==="inner"){

    const side =
    Math.sqrt(
    2-
    2*Math.cos(
    2*Math.PI/n
    )
    );

    const lower =
    n*side/2;

    ctx.fillText(
        `内接正${n}角形`,
        20,
        35
    );

    ctx.fillText(
        `${lower.toFixed(5)} < π` ,
        20,
        60
    );

    ctx.fillText(
        `一辺 ≒ ${side.toFixed(5)}`,
        20,
        85
    );

}
else{

    const side =
    2*Math.tan(
        Math.PI/n
    );

    const upper =
    n*Math.tan(
        Math.PI/n
    );

    ctx.fillStyle="black";
    ctx.font="20px sans-serif";

    ctx.fillText(
        `外接正${n}角形`,
        20,
        35
    );

    ctx.fillText(
        `π < ${upper.toFixed(5)}`,
        20,
        60
    );

    ctx.fillText(
        `一辺 ≒ ${side.toFixed(5)}`,
        20,
        85
    );

}

/***** ミッション表示 *****/

if(mode==="inner"){

    const side =
    Math.sqrt(
    2-
    2*Math.cos(
    2*Math.PI/n
    )
    );

    const lower =
    n*side/2;

    let mission1;

    if(lower > 3.05){

        mission1 =
        "✅ ① 3.05 < π を満たす n を発見！";

    }
    else{

        mission1 =
        "□ ① 3.05 < π を満たす n の値を探せ";

    }

    document.getElementById("mission")
    .innerHTML=
    `
    <h2>🎯 MAIN MISSION（内接）</h2>

    ${mission1}
    
    <br><br>

    □ ② 赤い辺の長さを求めよう

    <br><br>

    □ ③ 正${n}角形の周の長さを求めよう

    <br><br>

    □ ④ 円周率 π の下限を不等式で表そう
    `;

}
else{

    const upper =
    n*Math.tan(
    Math.PI/n
    );

    let mission1;

    if(upper < 3.25){

        mission1 =
        `✅ ① π < 3.25 を満たす n=${n} を発見！`;

    }else{

        mission1 =
        "□ ① π < 3.25 を満たす n の値を探せ";

    }

    document.getElementById("mission")
    .innerHTML=
    `
    <h2>⭐ BONUS CHALLENGE（外接）</h2>

    ${mission1}

    <br><br>

    □ ② 赤い辺の長さを求めよう

    <br><br>

    □ ③ 正${n}角形の周の長さを求めよう

    <br><br>

    □ ④ 円周率 π の上限を不等式で表そう
    `;

}

}

draw();

</script>

</body>
</html>
